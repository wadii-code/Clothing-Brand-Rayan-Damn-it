name: CI

# Lint, type-check and build every push and pull request. Needs no secrets:
# without Supabase env vars the build serves the demo products.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same npm that writes package-lock.json locally: older releases (npm 10, early npm 11)
      # resolve the optional wasm packages differently and reject the lockfile.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run build
